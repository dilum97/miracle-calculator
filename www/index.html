<!DOCTYPE html>
<html lang="si">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Miracle Photography - Price Calculator</title>
<style>
  :root{
    --gold: #d4af37;
    --gold-light: #f3d576;
    --gold-dark: #9c7a1e;
    --black: #0a0a0a;
    --black-soft: #141414;
    --card: #1b1b1b;
    --border: #333333;
    --text: #f2f2f2;
    --text-dim: #b3b3b3;
  }

  * { box-sizing: border-box; margin:0; padding:0; }

  body{
    background: radial-gradient(circle at top, #1a1a1a 0%, var(--black) 70%);
    color: var(--text);
    font-family: 'Georgia', 'Segoe UI', serif;
    min-height: 100vh;
    padding: 16px;
    display: flex;
    justify-content: center;
  }

  .wrap{
    width: 100%;
    max-width: 520px;
  }

  header{
    text-align: center;
    padding: 28px 12px 20px;
    border-bottom: 1px solid var(--gold-dark);
    margin-bottom: 20px;
  }

  header .header-logo{
    width: 88px;
    height: auto;
    margin: 0 auto 12px;
    display: block;
    filter: drop-shadow(0 0 6px rgba(212,175,55,0.35));
  }

  header h1{
    font-size: 28px;
    letter-spacing: 3px;
    color: var(--gold);
    font-weight: 400;
    text-transform: uppercase;
  }

  header h1 span{
    display:block;
    font-size: 13px;
    letter-spacing: 5px;
    color: var(--text-dim);
    margin-top: 6px;
    text-transform: uppercase;
  }

  .card{
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 10px;
    overflow: hidden;
    box-shadow: 0 8px 24px rgba(0,0,0,0.5);
  }

  .item{
    display: flex;
    flex-direction: column;
    gap: 10px;
    padding: 16px 16px;
    border-bottom: 1px solid var(--border);
  }

  .item:last-child{ border-bottom: none; }

  .item-top{
    display: flex;
    align-items: flex-start;
    gap: 10px;
  }

  .item-top input[type="checkbox"]{
    appearance: none;
    -webkit-appearance: none;
    width: 20px;
    height: 20px;
    min-width: 20px;
    border: 1.5px solid var(--gold-dark);
    border-radius: 4px;
    background: var(--black-soft);
    position: relative;
    cursor: pointer;
    margin-top: 2px;
  }

  .item-top input[type="checkbox"]:checked{
    background: var(--gold);
    border-color: var(--gold);
  }

  .item-top input[type="checkbox"]:checked::after{
    content: "✓";
    position: absolute;
    top: -3px;
    left: 3px;
    font-size: 14px;
    color: var(--black);
    font-weight: bold;
  }

  .item-name{
    font-size: 15px;
    color: var(--text);
    line-height: 1.4;
    flex: 1;
  }

  .item-fields{
    display: grid;
    grid-template-columns: 1fr 70px 1fr;
    gap: 8px;
    align-items: center;
    padding-left: 30px;
  }

  .noqty-toggle{
    display: flex;
    align-items: center;
    gap: 8px;
    padding-left: 30px;
    font-size: 12px;
    color: var(--text-dim);
    cursor: pointer;
    letter-spacing: 0.5px;
  }

  .noqty-toggle input[type="checkbox"]{
    appearance: none;
    -webkit-appearance: none;
    width: 16px;
    height: 16px;
    min-width: 16px;
    border: 1.5px solid var(--gold-dark);
    border-radius: 4px;
    background: var(--black-soft);
    position: relative;
    cursor: pointer;
  }

  .noqty-toggle input[type="checkbox"]:checked{
    background: var(--gold);
    border-color: var(--gold);
  }

  .noqty-toggle input[type="checkbox"]:checked::after{
    content: "✓";
    position: absolute;
    top: -3px;
    left: 2px;
    font-size: 11px;
    color: var(--black);
    font-weight: bold;
  }

  .item-fields.no-qty{
    grid-template-columns: 1fr;
  }

  .field-group{
    display: flex;
    flex-direction: column;
    gap: 4px;
  }

  .field-group label{
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 1px;
    color: var(--text-dim);
  }

  .field-group input{
    background: var(--black-soft);
    border: 1px solid var(--border);
    color: var(--gold-light);
    padding: 8px 8px;
    border-radius: 6px;
    font-size: 16px;
    width: 100%;
    font-family: inherit;
    -webkit-appearance: none;
    appearance: none;
    -webkit-text-fill-color: var(--gold-light);
    opacity: 1;
  }

  .field-group input:disabled{
    -webkit-text-fill-color: var(--text-dim);
    opacity: 1;
    color: var(--text-dim);
  }

  .field-group input:focus{
    outline: none;
    border-color: var(--gold);
  }

  .qty-field input{
    text-align: center;
  }

  .line-total{
    text-align: right;
    font-size: 13px;
    color: var(--text-dim);
    padding-left: 30px;
  }

  .line-total b{
    color: var(--gold-light);
    font-size: 15px;
  }

  .item.disabled .item-fields,
  .item.disabled .line-total{
    opacity: 0.35;
    pointer-events: none;
  }

  .item.disabled .item-name{
    color: var(--text-dim);
    text-decoration: line-through;
  }

  .add-custom{
    padding: 14px 16px;
    border-top: 1px dashed var(--gold-dark);
  }

  .add-custom button{
    width: 100%;
    background: transparent;
    border: 1px dashed var(--gold-dark);
    color: var(--gold);
    padding: 10px;
    border-radius: 6px;
    font-size: 13px;
    letter-spacing: 1px;
    cursor: pointer;
    font-family: inherit;
  }

  .add-custom button:active{
    background: rgba(212,175,55,0.1);
  }

  .summary{
    margin-top: 22px;
    background: linear-gradient(135deg, #1c1707 0%, #0a0a0a 100%);
    border: 1px solid var(--gold-dark);
    border-radius: 10px;
    padding: 20px;
  }

  .summary-row{
    display: flex;
    justify-content: space-between;
    font-size: 14px;
    color: var(--text-dim);
    padding: 6px 0;
  }

  .summary-row.grand{
    border-top: 1px solid var(--gold-dark);
    margin-top: 8px;
    padding-top: 14px;
    font-size: 20px;
    color: var(--gold-light);
    font-weight: bold;
    letter-spacing: 1px;
  }

  .summary-row.grand span:last-child{
    color: var(--gold);
  }

  .discount-row{
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    margin-top: 10px;
    padding-top: 10px;
    border-top: 1px solid var(--border);
  }

  .discount-row label{
    font-size: 13px;
    color: var(--text-dim);
    letter-spacing: 1px;
    text-transform: uppercase;
  }

  .discount-row .discount-input{
    display:flex;
    align-items:center;
    gap:6px;
  }

  .discount-row input{
    background: var(--black-soft);
    border: 1px solid var(--border);
    color: var(--gold-light);
    padding: 8px;
    border-radius: 6px;
    width: 80px;
    text-align: center;
    font-family: inherit;
  }

  .discount-row select{
    background: var(--black-soft);
    border: 1px solid var(--border);
    color: var(--gold-light);
    padding: 8px 4px;
    border-radius: 6px;
    font-family: inherit;
  }

  footer{
    text-align: center;
    margin-top: 24px;
    padding-bottom: 20px;
    color: var(--text-dim);
    font-size: 11px;
    letter-spacing: 2px;
    text-transform: uppercase;
  }

  footer .gold-line{
    width: 40px;
    height: 1px;
    background: var(--gold-dark);
    margin: 12px auto;
  }

  .remove-btn{
    background: transparent;
    border: none;
    color: #8a4646;
    font-size: 18px;
    cursor: pointer;
    padding: 0 4px;
    line-height: 1;
  }

  .action-buttons{
    display: flex;
    flex-direction: column;
    gap: 10px;
    margin-top: 16px;
  }

  .action-btn{
    width: 100%;
    padding: 14px;
    border-radius: 8px;
    font-size: 14px;
    letter-spacing: 1px;
    font-family: inherit;
    cursor: pointer;
    border: none;
    text-transform: uppercase;
  }

  .action-btn.primary{
    background: linear-gradient(135deg, var(--gold-light), var(--gold-dark));
    color: var(--black);
    font-weight: bold;
  }

  .action-btn.primary:active{
    filter: brightness(0.9);
  }

  .action-btn.whatsapp{
    background: #1f2c22;
    color: #4ddb6f;
    border: 1px solid #2f5b39;
  }

  .action-btn.whatsapp:active{
    background: #24322a;
  }

  .action-btn.preview{
    background: transparent;
    color: var(--gold-light);
    border: 1px solid var(--gold-dark);
  }

  .action-btn.preview:active{
    background: rgba(212,175,55,0.12);
  }

  /* ===== Bill preview modal ===== */
  .pv-modal{
    display: none;
    position: fixed;
    inset: 0;
    z-index: 1000;
    background: var(--black);
    flex-direction: column;
  }
  .pv-modal.open{ display: flex; }

  .pv-bar{
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    padding: 12px 14px;
    background: var(--black-soft);
    border-bottom: 1px solid var(--border);
  }
  .pv-bar-title{
    color: var(--gold-light);
    font-size: 14px;
    letter-spacing: 2px;
    text-transform: uppercase;
  }
  .pv-bar-actions{ display: flex; gap: 8px; }
  .pv-icon-btn{
    background: var(--card);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 8px 12px;
    font-size: 13px;
    font-family: inherit;
    cursor: pointer;
  }
  .pv-icon-btn:active{ filter: brightness(0.85); }

  .pv-body{
    flex: 1;
    overflow: auto;
    padding: 12px;
    -webkit-overflow-scrolling: touch;
  }
  .pv-scaler{ margin: 0 auto; }

  .pv-foot{
    display: flex;
    gap: 10px;
    padding: 12px 14px;
    background: var(--black-soft);
    border-top: 1px solid var(--border);
  }
  .pv-foot .action-btn{ flex: 1; }

  /* The "paper" mirrors the PDF layout (A4 = 595pt wide) */
  .pv-paper{
    width: 595px;
    min-height: 842px;
    padding: 40px 50px;
    background: #fff;
    color: #1e1e1e;
    font-family: "Times New Roman", Times, serif;
    transform-origin: top left;
    box-shadow: 0 4px 24px rgba(0,0,0,0.6);
  }
  .pv-logo{ display: block; width: 130px; height: 109.7px; margin: 0 auto 30px; }
  .pv-gold-line{ height: 1.2px; background: #b48c28; }
  .pv-grey-line{ height: 1px; background: #d2d2d2; }
  .pv-title{ text-align: center; font-size: 12px; line-height: 14px; color: #5a5a5a; margin-top: 12px; }
  .pv-meta{ display: flex; justify-content: space-between; gap: 12px; font-size: 11px; line-height: 14px; margin-top: 20px; }
  .pv-meta + .pv-grey-line{ margin-top: 22px; }
  .pv-row{
    display: grid;
    grid-template-columns: 230px 85px 80px 100px;
    font-size: 11px;
    line-height: 14px;
    min-height: 18px;
    margin-bottom: 6px;
  }
  .pv-row > div:not(:first-child){ text-align: right; }
  .pv-name{ overflow-wrap: anywhere; }
  .pv-th{ font-weight: bold; min-height: 0; margin: 11px 0 0; }
  .pv-th + .pv-grey-line{ margin-top: 7px; }
  .pv-rows{ margin-top: 9px; }
  .pv-rows + .pv-gold-line{ margin-top: 23px; }
  .pv-tot{ display: grid; grid-template-columns: 315px 180px; text-align: right; }
  .pv-grand{ font-size: 15px; line-height: 18px; font-weight: bold; color: #141414; margin-top: 12px; }
  .pv-adv{ font-size: 11px; line-height: 14px; color: #3c3c3c; margin-top: 7px; }
  .pv-bal{ font-size: 11px; line-height: 14px; color: #3c3c3c; margin-top: 4px; }
  .pv-thanks{ text-align: center; font-style: italic; font-size: 10px; line-height: 12px; color: #787878; margin-top: 27px; }

  /* ===== Menu button + side drawer ===== */
  header{ position: relative; }
  .menu-btn{
    position: absolute;
    top: 14px;
    left: 12px;
    width: 42px;
    height: 42px;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--card);
    color: var(--gold-light);
    border: 1px solid var(--gold-dark);
    border-radius: 10px;
    cursor: pointer;
  }
  .menu-btn:active{ filter: brightness(0.85); }

  .drawer-overlay{
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.6);
    opacity: 0;
    pointer-events: none;
    transition: opacity .25s ease;
    z-index: 900;
  }
  .drawer-overlay.open{ opacity: 1; pointer-events: auto; }

  .drawer{
    position: fixed;
    top: 0;
    bottom: 0;
    left: 0;
    width: min(84vw, 330px);
    display: flex;
    flex-direction: column;
    background: var(--black-soft);
    border-right: 1px solid var(--gold-dark);
    box-shadow: 4px 0 24px rgba(0,0,0,0.6);
    transform: translateX(-102%);
    visibility: hidden;
    transition: transform .28s ease, visibility 0s linear .28s;
    z-index: 901;
  }
  .drawer.open{
    transform: translateX(0);
    visibility: visible;
    transition: transform .28s ease, visibility 0s;
  }
  .drawer [hidden]{ display: none !important; }

  .drawer-head{
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 14px;
    border-bottom: 1px solid var(--border);
  }
  .drawer-title{
    flex: 1;
    color: var(--gold-light);
    font-size: 14px;
    letter-spacing: 2px;
    text-transform: uppercase;
  }
  .drawer-icon-btn{
    background: var(--card);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 8px;
    width: 36px;
    height: 36px;
    font-size: 16px;
    font-family: inherit;
    cursor: pointer;
  }
  .drawer-icon-btn:active{ filter: brightness(0.85); }

  .drawer-view{ flex: 1; overflow-y: auto; padding: 12px; -webkit-overflow-scrolling: touch; }

  .drawer-item{
    width: 100%;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    padding: 14px;
    background: var(--card);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 10px;
    font-size: 15px;
    font-family: inherit;
    text-align: left;
    cursor: pointer;
  }
  .drawer-item:active{ filter: brightness(0.85); }
  .drawer-item .chev{ color: var(--gold-light); font-size: 20px; }

  .hist-count{ color: var(--text-dim); font-size: 12px; letter-spacing: 1px; margin: 2px 2px 10px; }
  .hist-empty{ color: var(--text-dim); font-size: 14px; line-height: 1.6; padding: 24px 8px; text-align: center; }

  .hist-item{
    display: flex;
    align-items: stretch;
    gap: 8px;
    margin-bottom: 10px;
  }
  .hist-main{
    flex: 1;
    min-width: 0;
    padding: 12px;
    background: var(--card);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 10px;
    font-family: inherit;
    text-align: left;
    cursor: pointer;
  }
  .hist-main:active{ filter: brightness(0.85); }
  .hist-name{ font-size: 15px; color: var(--gold-light); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .hist-meta{ font-size: 12px; color: var(--text-dim); margin-top: 4px; }
  .hist-total{ font-size: 14px; margin-top: 6px; }
  .hist-del{
    width: 44px;
    background: var(--card);
    color: #e57373;
    border: 1px solid var(--border);
    border-radius: 10px;
    font-size: 16px;
    font-family: inherit;
    cursor: pointer;
  }
  .hist-del:active{ filter: brightness(0.85); }

  @media (max-width: 380px){
    .item-fields{
      grid-template-columns: 1fr 60px 1fr;
    }
    header h1{ font-size: 22px; letter-spacing: 2px; }
  }
</style>

    <h1><span>Price Calculator</span></h1>
  </header>

  <div class="card" style="padding:16px; margin-bottom:14px;">
    <div class="field-group">
      <label>Customer Name (for quotation)</label>
      <input type="text" id="customerName" placeholder="e.g. Nimal &amp; Kamala Wedding">
    </div>
  </div>

  <div class="card" id="itemsList"></div>

  <div class="card add-custom" style="border-radius:10px; margin-top:14px;">
    <button id="addCustomBtn" type="button">+ Add Custom Item</button>
  </div>

  <div class="summary">
    <div class="summary-row grand">
      <span>Total</span>
      <span id="grandTotalVal">Rs. 0</span>
    </div>
    <div class="summary-row">
      <span>Advance Payment (20%)</span>
      <span id="advanceVal">Rs. 0</span>
    </div>
    <div class="summary-row">
      <span>Balance on Delivery</span>
      <span id="balanceVal">Rs. 0</span>
    </div>
  </div>

  <div class="action-buttons">
    <button id="previewBtn" type="button" class="action-btn preview">👁 Preview Bill</button>
    <button id="downloadPdfBtn" type="button" class="action-btn primary">⬇ Download PDF</button>
    <button id="whatsappBtn" type="button" class="action-btn whatsapp">📲 Send via WhatsApp</button>
  </div>

  <div id="drawerOverlay" class="drawer-overlay"></div>
  <aside id="drawer" class="drawer" aria-label="Menu">
    <div class="drawer-head">
      <button id="drawerBack" type="button" class="drawer-icon-btn" aria-label="Back" hidden>&larr;</button>
      <span id="drawerTitle" class="drawer-title">Menu</span>
      <button id="drawerClose" type="button" class="drawer-icon-btn" aria-label="Close menu">&#x2715;</button>
    </div>
    <div id="drawerMenuView" class="drawer-view">
      <button id="menuHistoryBtn" type="button" class="drawer-item"><span>&#x1F9FE; Quotation History</span><span class="chev">&rsaquo;</span></button>
    </div>
    <div id="drawerHistoryView" class="drawer-view" hidden>
      <div id="historyList"></div>
    </div>
  </aside>

  <div id="pvModal" class="pv-modal" role="dialog" aria-modal="true" aria-label="Bill preview">
    <div class="pv-bar">
      <span class="pv-bar-title">Bill Preview</span>
      <div class="pv-bar-actions">
        <button id="pvZoomBtn" type="button" class="pv-icon-btn">🔍 Zoom</button>
        <button id="pvCloseBtn" type="button" class="pv-icon-btn" aria-label="Close preview">✕</button>
      </div>
    </div>
    <div id="pvBody" class="pv-body">
      <div id="pvScaler" class="pv-scaler"></div>
    </div>
    <div class="pv-foot">
      <button id="pvBackBtn" type="button" class="action-btn preview">Close</button>
      <button id="pvDownloadBtn" type="button" class="action-btn primary">⬇ Download PDF</button>
    </div>
  </div>

  <footer>
    Miracle Photography
    <div class="gold-line"></div>
    Package Estimate
  </footer>

</div>

  const defaultItems = [
    { name: "Pre-Shoot", price: 10000, qty: 1, fixed: false, noQty: false },
    { name: "Each additional pre-shoot dress", price: 10000, qty: 0, fixed: false, noQty: false },
    { name: "01 Thank you card Price", price: 150, qty: 0, fixed: false, noQty: false },
    { name: "Morning shoot, Function covering, Evening shoot", price: 40000, qty: 0, fixed: false, noQty: false },
    { name: "16 x 24 Enlargement 01", price: 10000, qty: 0, fixed: false, noQty: false },
    { name: "Second Day Shoot", price: 15000, qty: 0, fixed: false, noQty: false },
    { name: "Transport", price: 5000, qty: 1, fixed: false, noQty: true, isTransport: true }
  ];

  let items = defaultItems.map((it, i) => ({
    id: "item-" + i,
    name: it.name,
    price: it.price,
    qty: it.qty,
    active: it.noQty ? false : it.qty > 0,
    custom: false,
    fixed: it.fixed,
    noQty: it.noQty,
    isTransport: !!it.isTransport
  }));

  let customCounter = 0;

  const itemsList = document.getElementById("itemsList");
  const grandTotalVal = document.getElementById("grandTotalVal");
  const advanceVal = document.getElementById("advanceVal");
  const balanceVal = document.getElementById("balanceVal");
  const addCustomBtn = document.getElementById("addCustomBtn");

  function formatRs(n){
    n = Math.round(n) || 0;
    var isNegative = n < 0;
    n = Math.abs(n);
    var str = String(n).replace(/\B(?=(\d{3})+(?!\d))/g, ",");
    return "Rs. " + (isNegative ? "-" : "") + str;
  }

  function render(){
    itemsList.innerHTML = "";
    items.forEach(item => {
      const row = document.createElement("div");
      row.className = "item" + (item.active ? "" : " disabled");

      row.innerHTML = `
        <div class="item-top">
          <input type="checkbox" data-id="${item.id}" class="chk" ${item.active ? "checked" : ""}>
          <div class="item-name">
            ${item.custom
              ? `<input type="text" class="field-group" style="background:var(--black-soft);border:1px solid var(--border);color:var(--text);padding:6px;border-radius:6px;width:100%;font-family:inherit;font-size:16px;-webkit-appearance:none;appearance:none;" data-id="${item.id}" data-field="name" value="${item.name}">`
              : item.name}
          </div>
          ${item.custom ? `<button type="button" class="remove-btn" data-id="${item.id}">✕</button>` : ""}
        </div>
        <label class="noqty-toggle">
          <input type="checkbox" class="noqty-chk" data-id="${item.id}" ${item.noQty ? "checked" : ""}>
          <span>No Qty (direct price only)</span>
        </label>
        <div class="item-fields ${item.noQty ? "no-qty" : ""}">
          ${item.noQty ? `
          <div class="field-group">
            <label>Price (Rs.)</label>
            <input type="number" min="0" data-id="${item.id}" data-field="price" value="${item.price}" ${item.fixed ? "disabled" : ""}>
          </div>` : `
          <div class="field-group">
            <label>Price (Rs.)</label>
            <input type="number" min="0" data-id="${item.id}" data-field="price" value="${item.price}" ${item.fixed ? "disabled" : ""}>
          </div>
          <div class="field-group qty-field">
            <label>Qty</label>
            <input type="number" min="0" data-id="${item.id}" data-field="qty" value="${item.qty}">
          </div>
          <div class="field-group">
            <label>Line Total</label>
            <input type="text" value="${formatRs(item.price * item.qty)}" disabled>
          </div>`}
        </div>
      `;
      itemsList.appendChild(row);
    });

    attachEvents();
    calculate();
  }

  function attachEvents(){
    document.querySelectorAll(".chk").forEach(el => {
      el.addEventListener("change", e => {
        const id = e.target.dataset.id;
        const item = items.find(i => i.id === id);
        item.active = e.target.checked;
        if (item.active && item.qty === 0) item.qty = 1;
        render();
      });
    });

    document.querySelectorAll('input[data-field="price"]').forEach(el => {
      el.addEventListener("input", e => {
        const id = e.target.dataset.id;
        const item = items.find(i => i.id === id);
        item.price = parseFloat(e.target.value) || 0;
        calculate();
        if (!item.noQty) updateLineTotal(id);
      });
    });

    document.querySelectorAll('input[data-field="qty"]').forEach(el => {
      el.addEventListener("input", e => {
        const id = e.target.dataset.id;
        const item = items.find(i => i.id === id);
        item.qty = parseFloat(e.target.value) || 0;
        calculate();
        updateLineTotal(id);
      });
    });

    document.querySelectorAll('input[data-field="name"]').forEach(el => {
      el.addEventListener("input", e => {
        const id = e.target.dataset.id;
        const item = items.find(i => i.id === id);
        item.name = e.target.value;
      });
    });

    document.querySelectorAll(".remove-btn").forEach(el => {
      el.addEventListener("click", e => {
        const id = e.target.dataset.id;
        items = items.filter(i => i.id !== id);
        render();
      });
    });

    document.querySelectorAll(".noqty-chk").forEach(el => {
      el.addEventListener("change", e => {
        const id = e.target.dataset.id;
        const item = items.find(i => i.id === id);
        item.noQty = e.target.checked;
        item.qty = 1;
        render();
      });
    });
  }

  function updateLineTotal(id){
    const item = items.find(i => i.id === id);
    const row = document.querySelector(`.chk[data-id="${id}"]`).closest(".item");
    const totalInput = row.querySelector(".field-group:last-child input");
    totalInput.value = formatRs(item.price * item.qty);
  }

  function calculate(){
    let subtotal = 0;
    items.forEach(item => {
      if (item.active) subtotal += item.price * item.qty;
    });

    grandTotalVal.textContent = formatRs(subtotal);
    const advance = subtotal * 0.2;
    const balance = subtotal - advance;
    advanceVal.textContent = formatRs(advance);
    balanceVal.textContent = formatRs(balance);
  }

  addCustomBtn.addEventListener("click", () => {
    customCounter++;
    const newItem = {
      id: "custom-" + customCounter,
      name: "New Item",
      price: 0,
      qty: 1,
      active: true,
      custom: true,
      fixed: false,
      noQty: false,
      isTransport: false
    };
    const transportIndex = items.findIndex(i => i.isTransport);
    if (transportIndex === -1){
      items.push(newItem);
    } else {
      items.splice(transportIndex, 0, newItem);
    }
    render();
  });

  function buildInvoiceLines(){
    return items.filter(i => i.active && i.qty > 0);
  }

  function currentSnapshot(){
    return {
      customerName: document.getElementById("customerName").value.trim(),
      dateStr: new Date().toLocaleDateString("en-GB"),
      lines: buildInvoiceLines().map(i => ({ name: i.name, price: i.price, qty: i.qty, noQty: !!i.noQty }))
    };
  }

  function generatePdf(snap){
    snap = snap || currentSnapshot();
    const { jsPDF } = window.jspdf;
    const doc = new jsPDF({ unit: "pt", format: "a4" });
    const pageWidth = doc.internal.pageSize.getWidth();
    const marginX = 50;
    let y = 60;

    // Logo
    try {
      const logoWidth = 130;
      const logoHeight = 130 * (254/301);
      doc.addImage(LOGO_BASE64, "PNG", (pageWidth - logoWidth) / 2, y - 20, logoWidth, logoHeight);
      y += logoHeight + 10;
    } catch(e){
      // if logo fails to load, continue without it
    }

    doc.setDrawColor(180, 140, 40);
    doc.setLineWidth(1.2);
    doc.line(marginX, y, pageWidth - marginX, y);

    y += 22;
    doc.setFont("times", "normal");
    doc.setFontSize(12);
    doc.setTextColor(90, 90, 90);
    doc.text("Price Quotation", pageWidth / 2, y, { align: "center" });

    y += 34;
    const customerName = snap.customerName;
    const dateStr = snap.dateStr;

    doc.setFontSize(11);
    doc.setTextColor(30, 30, 30);
    doc.text(`Customer: ${customerName || "-"}`, marginX, y);
    doc.text(`Date: ${dateStr}`, pageWidth - marginX, y, { align: "right" });

    y += 26;
    doc.setDrawColor(210, 210, 210);
    doc.setLineWidth(0.7);
    doc.line(marginX, y, pageWidth - marginX, y);

    y += 22;
    doc.setFont("times", "bold");
    doc.setFontSize(11);
    doc.text("Item", marginX, y);
    doc.text("Price", pageWidth - 230, y, { align: "right" });
    doc.text("Qty", pageWidth - 150, y, { align: "right" });
    doc.text("Total", pageWidth - marginX, y, { align: "right" });

    y += 10;
    doc.setLineWidth(0.7);
    doc.line(marginX, y, pageWidth - marginX, y);

    y += 20;
    doc.setFont("times", "normal");
    doc.setFontSize(11);

    const lines = snap.lines;
    let grandTotal = 0;

    lines.forEach(item => {
      const lineTotal = item.price * item.qty;
      grandTotal += lineTotal;

      const nameLines = doc.splitTextToSize(item.name, 230);
      doc.text(nameLines, marginX, y);
      doc.text(item.noQty ? "" : formatRs(item.price), pageWidth - 230, y, { align: "right" });
      doc.text(item.noQty ? "-" : String(item.qty), pageWidth - 150, y, { align: "right" });
      doc.text(formatRs(lineTotal), pageWidth - marginX, y, { align: "right" });

      y += Math.max(18, nameLines.length * 14) + 6;

      if (y > 720){
        doc.addPage();
        y = 60;
      }
    });

    y += 6;
    doc.setLineWidth(1);
    doc.setDrawColor(180, 140, 40);
    doc.line(marginX, y, pageWidth - marginX, y);

    y += 26;
    doc.setFont("times", "bold");
    doc.setFontSize(15);
    doc.setTextColor(20, 20, 20);
    doc.text("Grand Total:", pageWidth - 230, y, { align: "right" });
    doc.text(formatRs(grandTotal), pageWidth - marginX, y, { align: "right" });

    const advanceAmount = grandTotal * 0.2;
    const balanceAmount = grandTotal - advanceAmount;

    y += 22;
    doc.setFont("times", "normal");
    doc.setFontSize(11);
    doc.setTextColor(60, 60, 60);
    doc.text("Advance Payment (20%):", pageWidth - 230, y, { align: "right" });
    doc.text(formatRs(advanceAmount), pageWidth - marginX, y, { align: "right" });

    y += 18;
    doc.text("Balance on Delivery:", pageWidth - 230, y, { align: "right" });
    doc.text(formatRs(balanceAmount), pageWidth - marginX, y, { align: "right" });

    y += 40;
    doc.setFont("times", "italic");
    doc.setFontSize(10);
    doc.setTextColor(120, 120, 120);
    doc.text("Thank you for choosing Miracle Photography.", pageWidth / 2, y, { align: "center" });

    return doc;
  }

  /* ===== Bill Preview (mirrors generatePdf layout) ===== */
  const pvModal = document.getElementById("pvModal");
  const pvBody = document.getElementById("pvBody");
  const pvScaler = document.getElementById("pvScaler");
  const pvZoomBtn = document.getElementById("pvZoomBtn");
  let pvZoomed = false;
  let pvCurrent = null; // null = current form, otherwise a saved quotation snapshot

  function escHtml(str){
    return String(str)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;");
  }

  function buildPreviewHtml(snap){
    const { lines, customerName, dateStr } = snap || currentSnapshot();
    let grandTotal = 0;

    const rowsHtml = lines.map(item => {
      const lineTotal = item.price * item.qty;
      grandTotal += lineTotal;
      return `<div class="pv-row">
        <div class="pv-name">${escHtml(item.name)}</div>
        <div>${item.noQty ? "" : formatRs(item.price)}</div>
        <div>${item.noQty ? "-" : escHtml(item.qty)}</div>
        <div>${formatRs(lineTotal)}</div>
      </div>`;
    }).join("");

    const advanceAmount = grandTotal * 0.2;
    const balanceAmount = grandTotal - advanceAmount;

    return `<div class="pv-paper" id="pvPaper">
      <img class="pv-logo" src="${LOGO_BASE64}" alt="">
      <div class="pv-gold-line"></div>
      <div class="pv-title">Price Quotation</div>
      <div class="pv-meta">
        <span>Customer: ${escHtml(customerName || "-")}</span>
        <span>Date: ${dateStr}</span>
      </div>
      <div class="pv-grey-line"></div>
      <div class="pv-row pv-th"><div>Item</div><div>Price</div><div>Qty</div><div>Total</div></div>
      <div class="pv-grey-line"></div>
      <div class="pv-rows">${rowsHtml}</div>
      <div class="pv-gold-line"></div>
      <div class="pv-tot pv-grand"><div>Grand Total:</div><div>${formatRs(grandTotal)}</div></div>
      <div class="pv-tot pv-adv"><div>Advance Payment (20%):</div><div>${formatRs(advanceAmount)}</div></div>
      <div class="pv-tot pv-bal"><div>Balance on Delivery:</div><div>${formatRs(balanceAmount)}</div></div>
      <div class="pv-thanks">Thank you for choosing Miracle Photography.</div>
    </div>`;
  }

  function fitPreview(){
    const paper = document.getElementById("pvPaper");
    if (!paper) return;
    const avail = pvBody.clientWidth - 24;
    const scale = pvZoomed ? 1.3 : Math.min(1, avail / 595);
    paper.style.transform = "scale(" + scale + ")";
    pvScaler.style.width = (595 * scale) + "px";
    pvScaler.style.height = (paper.offsetHeight * scale) + "px";
  }

  function openPreview(snap){
    const data = snap || currentSnapshot();
    if (data.lines.length === 0){
      alert("Please select at least one item before generating the quotation.");
      return;
    }
    pvCurrent = snap || null;
    pvScaler.innerHTML = buildPreviewHtml(data);
    pvZoomed = false;
    pvZoomBtn.textContent = "🔍 Zoom";
    pvModal.classList.add("open");
    document.body.style.overflow = "hidden";
    pushUi("preview");
    pvBody.scrollTop = 0;
    pvBody.scrollLeft = 0;
    fitPreview();
  }

  function closePreview(){
    pvModal.classList.remove("open");
    document.body.style.overflow = drawerEl.classList.contains("open") ? "hidden" : "";
  }

  document.getElementById("previewBtn").addEventListener("click", () => openPreview());
  document.getElementById("pvCloseBtn").addEventListener("click", () => requestClose());
  document.getElementById("pvBackBtn").addEventListener("click", () => requestClose());
  document.getElementById("pvDownloadBtn").addEventListener("click", () => {
    if (pvCurrent) doDownload(pvCurrent, false);
    else document.getElementById("downloadPdfBtn").click();
  });
  pvZoomBtn.addEventListener("click", () => {
    pvZoomed = !pvZoomed;
    pvZoomBtn.textContent = pvZoomed ? "🔍 Fit" : "🔍 Zoom";
    fitPreview();
    pvBody.scrollLeft = 0;
  });
  window.addEventListener("resize", () => {
    if (pvModal.classList.contains("open")) fitPreview();
  });
  document.addEventListener("keydown", e => {
    if (e.key === "Escape") requestClose();
  });

  /* ===== Quotation history (saved on the phone) ===== */
  const HISTORY_KEY = "mp_quotation_history_v1";

  function loadHistory(){
    try {
      const arr = JSON.parse(localStorage.getItem(HISTORY_KEY) || "[]");
      return Array.isArray(arr) ? arr : [];
    } catch (e){
      return [];
    }
  }

  function saveHistory(list){
    try {
      localStorage.setItem(HISTORY_KEY, JSON.stringify(list));
      return true;
    } catch (e){
      return false;
    }
  }

  function snapTotal(snap){
    return snap.lines.reduce((sum, i) => sum + i.price * i.qty, 0);
  }

  function addToHistory(snap){
    const list = loadHistory();
    const now = Date.now();
    const sig = JSON.stringify([snap.customerName, snap.lines]);
    // same quotation downloaded/shared again within 10 minutes -> don't add a duplicate
    if (list[0] && list[0].sig === sig && now - list[0].ts < 10 * 60 * 1000) return;
    list.unshift({
      id: String(now) + Math.random().toString(36).slice(2, 6),
      ts: now,
      sig: sig,
      customerName: snap.customerName,
      dateStr: snap.dateStr,
      lines: snap.lines,
      total: snapTotal(snap)
    });
    if (list.length > 1000) list.length = 1000;
    saveHistory(list);
  }

  function fmtWhen(ts){
    const d = new Date(ts);
    return d.toLocaleDateString("en-GB") + " \u00B7 " +
      d.toLocaleTimeString("en-GB", { hour: "2-digit", minute: "2-digit", hour12: true });
  }

  /* ===== Side drawer + back-button handling ===== */
  const drawerEl = document.getElementById("drawer");
  const drawerOverlay = document.getElementById("drawerOverlay");
  const drawerTitle = document.getElementById("drawerTitle");
  const drawerBack = document.getElementById("drawerBack");
  const drawerMenuView = document.getElementById("drawerMenuView");
  const drawerHistoryView = document.getElementById("drawerHistoryView");
  const historyListEl = document.getElementById("historyList");

  // Every open overlay (drawer / preview) pushes a history entry, so the phone's Back button closes it instead of leaving the app.
  const uiStack = [];
  function pushUi(name){
    uiStack.push(name);
    try { history.pushState({ mpUi: name }, ""); } catch (e){}
  }
  function requestClose(){
    if (uiStack.length) history.back();
  }
  window.addEventListener("popstate", () => {
    const top = uiStack.pop();
    if (top === "preview") closePreview();
    else if (top === "drawer") closeDrawer();
  });

  function showDrawerView(view){
    const isHistory = view === "history";
    drawerMenuView.hidden = isHistory;
    drawerHistoryView.hidden = !isHistory;
    drawerBack.hidden = !isHistory;
    drawerTitle.textContent = isHistory ? "Quotation History" : "Menu";
    if (isHistory) renderHistory();
  }

  function openDrawer(){
    showDrawerView("menu");
    drawerEl.classList.add("open");
    drawerOverlay.classList.add("open");
    document.body.style.overflow = "hidden";
    pushUi("drawer");
  }

  function closeDrawer(){
    drawerEl.classList.remove("open");
    drawerOverlay.classList.remove("open");
    document.body.style.overflow = "";
  }

  function renderHistory(){
    const list = loadHistory();
    if (list.length === 0){
      historyListEl.innerHTML = '<div class="hist-empty">No quotations yet.<br>A quotation is saved here each time you download or share a PDF.</div>';
      return;
    }
    historyListEl.innerHTML =
      '<div class="hist-count">' + list.length + ' quotation' + (list.length === 1 ? '' : 's') + '</div>' +
      list.map(q => (
        '<div class="hist-item">' +
          '<button type="button" class="hist-main" data-act="preview" data-id="' + escHtml(q.id) + '">' +
            '<div class="hist-name">' + escHtml(q.customerName || "-") + '</div>' +
            '<div class="hist-meta">' + escHtml(fmtWhen(q.ts)) + ' \u00B7 ' + q.lines.length + ' item' + (q.lines.length === 1 ? '' : 's') + '</div>' +
            '<div class="hist-total">' + formatRs(q.total) + '</div>' +
          '</button>' +
          '<button type="button" class="hist-del" data-act="delete" data-id="' + escHtml(q.id) + '" aria-label="Delete quotation">\uD83D\uDDD1</button>' +
        '</div>'
      )).join("");
  }

  historyListEl.addEventListener("click", e => {
    const btn = e.target.closest("button[data-act]");
    if (!btn) return;
    const list = loadHistory();
    const q = list.find(x => x.id === btn.dataset.id);
    if (!q) return;
    if (btn.dataset.act === "preview"){
      openPreview({ customerName: q.customerName, dateStr: q.dateStr, lines: q.lines });
    } else if (btn.dataset.act === "delete"){
      if (confirm("Delete this quotation from history?")){
        saveHistory(list.filter(x => x.id !== q.id));
        renderHistory();
      }
    }
  });

  document.getElementById("menuBtn").addEventListener("click", openDrawer);
  document.getElementById("drawerClose").addEventListener("click", () => requestClose());
  drawerOverlay.addEventListener("click", () => requestClose());
  document.getElementById("menuHistoryBtn").addEventListener("click", () => showDrawerView("history"));
  drawerBack.addEventListener("click", () => showDrawerView("menu"));

  /* ===== Android app (Capacitor) support: save/share PDF natively ===== */
  function isNativeApp(){
    return !!(window.Capacitor && window.Capacitor.isNativePlatform && window.Capacitor.isNativePlatform());
  }

  async function sharePdfNative(doc, fileName, customerName){
    const { Filesystem, Share } = window.Capacitor.Plugins;
    const safeName = fileName.replace(/[\\/:*?"<>|]/g, "_");
    const base64 = doc.output("datauristring").split(",")[1];
    const saved = await Filesystem.writeFile({ path: safeName, data: base64, directory: "CACHE" });
    try {
      await Share.share({
        title: "Miracle Photography Quotation",
        text: "Price quotation for " + customerName + " - Miracle Photography",
        files: [saved.uri],
        dialogTitle: "Save or send quotation"
      });
    } catch (e){
      // user closed the share sheet - not an error
      if (!/cancel/i.test(String(e && (e.message || e)))) throw e;
    }
  }

  function isIOS(){
    return /iPad|iPhone|iPod/.test(navigator.userAgent) ||
      (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
  }

  async function doDownload(snap, record){
    if (snap.lines.length === 0){
      alert("Please select at least one item before generating the quotation.");
      return;
    }
    try {
      const doc = generatePdf(snap);
      if (record) addToHistory(snap);
      const customerName = snap.customerName || "Customer";
      const fileName = `Miracle-Photography-Quotation-${customerName}.pdf`;

      if (isNativeApp()){
        await sharePdfNative(doc, fileName, customerName);
        return;
      }

      if (isIOS()){
        // iOS Safari doesn't reliably support the download attribute.
        // Open the PDF in a new tab so the user can use the Share icon to save/send it.
        doc.output("dataurlnewwindow", { filename: fileName });
      } else {
        doc.save(fileName);
      }
    } catch (err){
      alert("Something went wrong generating the PDF. Please try again.");
    }
  }

  document.getElementById("downloadPdfBtn").addEventListener("click", () => doDownload(currentSnapshot(), true));

  document.getElementById("whatsappBtn").addEventListener("click", async () => {
    const snap = currentSnapshot();
    if (snap.lines.length === 0){
      alert("Please select at least one item before generating the quotation.");
      return;
    }

    try {
      const doc = generatePdf(snap);
      addToHistory(snap);
      const customerName = snap.customerName || "Customer";
      const fileName = `Miracle-Photography-Quotation-${customerName}.pdf`;
      if (isNativeApp()){
        await sharePdfNative(doc, fileName, customerName);
        return;
      }
      const pdfBlob = doc.output("blob");

      // Try native share first (works on most modern mobile browsers, includes WhatsApp in the share sheet)
      let shared = false;
      try {
        const pdfFile = new File([pdfBlob], fileName, { type: "application/pdf" });
        if (navigator.canShare && navigator.canShare({ files: [pdfFile] })){
          await navigator.share({
            files: [pdfFile],
            title: "Miracle Photography Quotation",
            text: `Price quotation for ${customerName} - Miracle Photography`
          });
          shared = true;
        }
      } catch (shareErr){
        // user cancelled or share not supported, fall through to fallback
      }

      if (shared) return;

      // Fallback: open the PDF in a new tab. From there the user can tap
      // the Share icon and pick WhatsApp to send the actual PDF file.
      doc.output("dataurlnewwindow", { filename: fileName });
      alert("PDF opened in a new tab. Tap the Share icon there and choose WhatsApp to send it.");
    } catch (err){
      alert("Something went wrong generating the quotation. Please try again.");
    }
  });

  render();
</script>
